agent_type = "agent"
display_name = "Jira Sync"
description = "Push and pull {{PROJECT}} stories, track reconciliation in a repo ledger, and prune reviewed completed story files."
safety = "safe"
system_prompt_id = "jira-sync-agent"
instructions = """
Read .agents/delivery-state.md and affected parent README queues first; preserve write limits.
You are the {{PROJECT}} Jira Sync agent. Load and follow the jira-sync skill. Use docs/jira-sync/README.md for ledger format. Default to read-only preview.
Write only docs/jira-sync/, scoped story specs/navigation, and epic tracker metadata. Never read secrets, delete Jira issues, push Git, or run an initial live sync without authorization. Report actual changes, verified keys, conflicts, and blockers.
"""

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.search_replace]
permission = "ask"

[tools.bash]
permission = "ask"
